    <script>
        (function () {
            const form = document.getElementById('siteSearch');
            const input = document.getElementById('search');
            if (!form || !input) return;

            // Matches the word "physiotheraphy" regardless of case.
            // \b handles word boundaries so it also works when surrounded by other words.
            const physiotheraphyWord = /\bphysio\b|\btheraphy\b/i;

            form.addEventListener('submit', function (e) {
                const q = input.value || '';
                if (physiotheraphyWord.test(q)) {
                    e.preventDefault();               // stop normal submit
                    window.location.href = 'physiotheraphy_search.html'; // redirect
                }
                // else: allow normal behavior (e.g., submit to your search endpoint)
            });
        })();
    </script>
