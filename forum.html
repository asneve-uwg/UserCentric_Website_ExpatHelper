        <div id="postHelp" class="help">Fill out the form and click <em>Post question</em>. Required fields are marked with *.</div>

        <div class="input">
            <label for="title">Title *</label>
            <input id="title" name="title" type="text" required minlength="8" maxlength="120"
                   placeholder="e.g., How to open a bank account in Malaysia?" />
        </div>

        <div class="input">
            <label for="country">Country *</label>
            <select id="country" name="country" required>
                <option value="">-- Select --</option>
                <option>Malaysia</option>
                <option>Spain</option>
                <option>Portugal</option>
                <option>Germany</option>
                <option>Canada</option>
                <option>Australia</option>
            </select>
        </div>

        <div class="input">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
                <option value="">-- Select --</option>
                <option>Visa & Docs</option>
                <option>Housing</option>
                <option>Healthcare</option>
                <option>Money & Taxes</option>
                <option>Safety & Fraud</option>
            </select>
        </div>

        <div class="input">
            <label for="body">Your question *</label>
            <textarea id="body" name="body" required minlength="20" rows="6"
                      placeholder="Provide details so others can help…"></textarea>
            <div class="help">Min 20 characters.</div>
        </div>

        <div class="input">
            <label for="email">Email (optional)</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" />
        </div>

        <div class="input">
            <input id="anon" name="anon" type="checkbox" />
            <label for="anon">Post anonymously</label>
        </div>

        <div style="display:flex; gap:.5rem">
            <button type="submit">Post question</button>
